<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fomalhaut</title>
    <script type="text/javascript">
      // Redirect from 404.html to index.html with route
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var route = pathSegments.slice(1).join('/');
      sessionStorage.redirect = route ? '/' + route : '/';
      window.location.replace('/Fomalhaut/');
    </script>
  </head>
  <body>
  </body>
</html>
