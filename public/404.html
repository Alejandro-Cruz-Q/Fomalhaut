<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fomalhaut</title>
    <script type="text/javascript">
      // Redirect from 404.html to index.html with route
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      // pathSegments = ['Fomalhaut', 'sensors']
      var route = '/' + pathSegments.slice(1).join('/'); // '/sensors'
      sessionStorage.redirect = route || '/';
      window.location.replace(
        window.location.protocol + '//' + window.location.host + '/Fomalhaut/'
      );
    </script>
  </head>
  <body>
  </body>
</html>
